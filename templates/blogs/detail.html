{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ blog.get_title }}{% endblock %}

{% block meta_description %}{{ blog.get_meta_description }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-6 text-[#5D5350]">{{ blog.get_title }}</h1>

        <div class="richtext-content prose prose-lg max-w-none text-[#5D5350]">
            {{ blog.get_full_description|safe }}
        </div>
    </div>
</div>
{% endblock %}
